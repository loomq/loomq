name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '25'
          cache: maven
      - name: Check formatting
        run: mvn spotless:check

  fast-tests:
    needs: format-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '25'
          cache: maven
      - name: Fast tests
        run: mvn test

  slow-tests:
    needs: format-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '25'
          cache: maven
      - name: Slow tests
        run: mvn test -Pslow-tests

  integration-tests:
    needs: format-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '25'
          cache: maven
      - name: Integration tests
        run: mvn test -Pintegration-tests

  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fast-tests, slow-tests, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '25'
          cache: maven
      - name: Package
        run: mvn package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: loomq-core
          path: loomq-core/target/*.jar
